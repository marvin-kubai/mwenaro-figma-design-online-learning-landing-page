<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <!-- WRAPPER -->
    <div class="wrapper">
      <!-- NAVIGATION -->
      <nav class="navbar">
        <div class="logo">
          <div class="logo-icon">
            <img src="images/Polygon-1.png" alt="polygon" />
          </div>
          <a href="#">Skilline</a>
        </div>
        <div class="nav-links">
          <a href="#">Home</a>
          <a href="#">Careers</a>
          <a href="#">Blog</a>
          <a href="#">About Us</a>
        </div>
        <div class="nav-buttons">
          <button class="btn-login">Login</button>
          <button class="btn-signup">Sign up</button>
        </div>
      </nav>

      <!-- HERO SECTION -->
      <section class="hero-container">
        <div class="hero">
          <!-- LEFT CONTENT -->
          <div class="hero-content">
            <h1>
              <h1><span>Studying</span> Online is now much easier</h1>
            </h1>
            <p>
              Skilline is an interesting platform that will teach you in a more
              interactive way
            </p>
            <div class="buttons">
              <button class="btn-1">Join for free</button>
              <div class="play">
                <button class="btn-2">
                  <img src="images/Group-4.png" alt="play button" />
                </button>
                <p>Watch how it works</p>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT CONTENT -->
        <div class="hero-image">
          <img
            class="header-pic"
            src="images/header-pic.png"
            alt="A girl holding books"
          />
        </div>
      </section>
      <!-- MAIN SECTION -->
      <main class="main">
        <div class="About">
          <p>Tusted by 5,000+ Companies Worldwide</p>
          <div class="company-logo">
            <img src="images/google-2015.png" alt="google logo">
            <img src="images/netflix.png" alt="netflix logo">
            <img src="images/airbnb.png" alt="airbnb logo">
            <img src="images/amazon.png" alt="amazon logo">
            <img src="images/facebook.png" alt="facebook logo">
            <img src="images/grab-logo.png" alt="grab logo">
          </div>
        </div>

      </main>
    </div>
  </body>
</html>
